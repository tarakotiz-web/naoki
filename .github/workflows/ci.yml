name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/ci?schema=public"
      AUTH_SECRET: "ci-only-secret"
      NEXTAUTH_URL: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # next build generates Next.js's own type declarations (e.g. LayoutProps)
      # before type-checking, so it also serves as the type-check step here.
      # A standalone `tsc --noEmit` fails on a fresh checkout because those
      # generated types don't exist until a build has run at least once.
      - name: Build (includes type check)
        run: npm run build
